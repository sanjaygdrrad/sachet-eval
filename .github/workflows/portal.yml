# Publishes the public portal (portal/ + the Sachet Python package) to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Portal

on:
  push:
    branches: [main]
    paths: ["portal/**", "src/sachet/**", "scripts/build_portal.py", ".github/workflows/portal.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test first (the portal runs this same code)
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Assemble the site
        run: python scripts/build_portal.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
