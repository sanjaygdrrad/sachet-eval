[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sachet-eval"
version = "0.5.0"
description = "Evaluation harness for LLM + text-to-speech disaster alerts in Nepal: faithfulness, intelligibility, latency."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanzay Bhandari" }]
keywords = ["nepal", "disaster", "early-warning", "llm", "evaluation", "text-to-speech", "nepali"]
classifiers = ["Programming Language :: Python :: 3", "Natural Language :: Nepali", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sachet = "sachet.cli:main"

[project.urls]
Homepage = "https://github.com/sanjaygdrrad/sachet-eval"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
