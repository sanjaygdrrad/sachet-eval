source = """
बाढी पूर्वानुमान बुलेटिन (जारी मिति: २०७८-०५-२९ गते बिहान ०७ बजे)

नदीहरूको हालको अवस्था: आज बिहानको मापन अनुसार कोशी, नारायणी, कर्णाली, महाकाली र यिनका सहायक नदीहरूको बहाव सामान्य तथा सतर्कता तह भन्दा तलै रहेको छ।

सरोकारवालाका लागि परामर्श: प्रदेश १ को झापा, मोरङ, सुनसरी, उदयपुर; बागमती प्रदेशको सिन्धुपाल्चोक, नुवाकोट, सिन्धुली, मकवानपुर; गण्डकी प्रदेशको गोरखा, लमजुङ, कास्की, स्याङ्जा, पर्वत; लुम्बिनी प्रदेशको पाल्पा, गुल्मी, रोल्पा; कर्णाली प्रदेशको जुम्ला, जाजरकोट, दैलेख, कालिकोट; सुदूरपश्चिम प्रदेशको दार्चुला, बझाङ, कञ्चनपुर र आसपासका जिल्ला भई बग्ने साना-साना नदीहरूमा बहाव बढ्ने र केहीमा आकस्मिक बहाव (Flash Flood) हुन सक्ने पूर्वानुमान रहेकाले उक्त नदीहरूका तटीय क्षेत्र तथा डुबान भइरहने क्षेत्रहरूमा सतर्कता अपनाऔं।

देशैभरका सर्वसाधारणको लागि ११५५ नम्बरको टोल-फ्री सेवा बाढी पूर्वसूचना प्रदान गर्ने उद्देश्यले मनसुनभर सञ्चालन गरिएको छ। जो कोहीले ११५५ डायल गरेर बाढी सम्बन्धी पूर्वसूचना लिन सक्नेछ।
"""

